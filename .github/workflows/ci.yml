name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DenseCheck.sln

      - name: Build
        run: dotnet build src/DenseCheck.Tests/DenseCheck.Tests.fsproj --configuration Release --no-restore --disable-build-servers

      - name: Test
        run: dotnet test src/DenseCheck.Tests/DenseCheck.Tests.fsproj --configuration Release --no-build --disable-build-servers
